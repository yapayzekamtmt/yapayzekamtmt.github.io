<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelimece · Meydan okuma</title>
<meta name="description" content="Arkadaşın Kelimece'de sana meydan okudu! Aynı kelimeyi sen de dene.">
<meta property="og:title" content="⚔️ Kelimece'de sana meydan okundu!">
<meta property="og:description" content="Arkadaşın bir kelimeyi buldu. Sen kaç tahminde bulursun?">
<meta name="theme-color" content="#5b3bd9">
<style>
  :root { --mor: #5b3bd9; --mor2: #8b5cf6; --turuncu: #fdba74; --yazi: #2b1650; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--yazi);
    background: linear-gradient(180deg, var(--mor) 0%, var(--mor2) 45%, #f472b6 80%, var(--turuncu) 100%); }
  main { width: min(420px, 100%); background: #fff; border-radius: 28px; padding: 28px 22px 24px; text-align: center;
    box-shadow: 0 10px 0 rgb(91 59 217 / .35), 0 24px 50px rgb(43 22 80 / .35); }
  h1 { margin: 0; font-size: 2.4rem; font-weight: 900; color: var(--mor); letter-spacing: -.02em; }
  .kareler { display: flex; justify-content: center; gap: 6px; margin: 14px 0 6px; }
  .kareler i { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 3px 0 rgb(0 0 0 / .18); }
  h2 { margin: 12px 0 4px; font-size: 1.25rem; }
  p { margin: 0 0 14px; color: #5b4a7a; }
  .kod { display: inline-block; margin: 4px 0 18px; padding: 10px 18px; border-radius: 14px; background: #f1ecff; border: 2px dashed var(--mor2);
    font: 800 1.5rem/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; color: var(--mor); }
  a.dugme { display: block; margin: 10px 0 0; padding: 14px 18px; border-radius: 999px; font-weight: 800; font-size: 1.05rem; text-decoration: none; }
  .ana { background: linear-gradient(180deg, var(--mor2), var(--mor)); color: #fff; box-shadow: 0 4px 0 #3b23a0; }
  .ikincil { background: #fff; color: var(--mor); border: 2px solid var(--mor2); }
  small { display: block; margin-top: 16px; color: #8a7aa8; line-height: 1.45; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Kelimece</h1>
  <div class="kareler" aria-hidden="true"><i style="background:#22c55e"></i><i style="background:#f59e0b"></i><i style="background:#22c55e"></i><i style="background:#94a3b8"></i><i style="background:#22c55e"></i></div>
  <h2 id="baslik">⚔️ Sana meydan okundu!</h2>
  <p>Arkadaşın bir kelimeyi buldu. Aynı kelimeyi sen de dene: kim daha az tahminde bulacak?</p>
  <div id="kodAlan"><div class="kod" id="kod"></div></div>
  <a class="dugme ana" id="ac" href="#">Kelimece'de aç</a>
  <a class="dugme ikincil" href="https://play.google.com/store/apps/details?id=com.kelimece.oyun">Google Play'den indir</a>
  <small id="not">Uygulama açılmazsa: Kelimece › <b>Modlar</b> › <b>Meydan okuma kodu</b> bölümüne kodu yaz.</small>
</main>
<script>
  const kod = (new URLSearchParams(location.search).get('m') || '').toUpperCase().replace(/[^0-9A-Z-]/g, '').slice(0, 14);
  const play = 'https://play.google.com/store/apps/details?id=com.kelimece.oyun';
  document.getElementById('kod').textContent = kod;
  document.getElementById('kodAlan').hidden = !kod;
  const ac = document.getElementById('ac');
  if (!kod) { ac.hidden = true; document.getElementById('baslik').textContent = 'Türkçe kelime bulmaca'; }
  else if (/android/i.test(navigator.userAgent)) {
    ac.href = 'intent://meydan?k=' + encodeURIComponent(kod) + '#Intent;scheme=kelimece;package=com.kelimece.oyun;S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
  } else { ac.hidden = true; }
</script>
</body>
</html>
